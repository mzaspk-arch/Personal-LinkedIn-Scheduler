<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
/* Brand tokens from personal-brand-tokens.json */
@font-face{font-family:Montserrat;font-weight:700;src:url(fonts/Montserrat-700.woff2) format("woff2")}
@font-face{font-family:Montserrat;font-weight:800;src:url(fonts/Montserrat-800.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:400;src:url(fonts/Inter-400.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:500;src:url(fonts/Inter-500.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:600;src:url(fonts/Inter-600.woff2) format("woff2")}
@font-face{font-family:Inter;font-weight:700;src:url(fonts/Inter-700.woff2) format("woff2")}
:root{
  --charcoal:#3C3C3C; --mid-grey:#8C8C8C; --white:#FFFFFF; --light-blue:#8FB4E3;
  --slate:#5A7EA8; --steel:#3F5F86; --studio-grey:#D0D0D0;
  --margin:88px; --body:34px; --body-lh:48px; --head:72px; --head-lh:81px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1350px;overflow:hidden;background:var(--charcoal)}
#canvas{position:relative;width:1080px;height:1350px;overflow:hidden;
  background:radial-gradient(ellipse 900px 760px at 50% 26%, var(--mid-grey) 0%, #6E6E6E 38%, #4A4A4A 70%, var(--charcoal) 100%);
  font-family:Inter,system-ui,sans-serif;color:var(--white)}
#net{position:absolute;inset:0}
body.v-left #canvas{background:radial-gradient(ellipse 820px 700px at 12% 14%, var(--mid-grey) 0%, #6E6E6E 36%, #4A4A4A 68%, var(--charcoal) 100%)}
body.v-panel #canvas{background:radial-gradient(ellipse 1000px 620px at 50% 8%, var(--mid-grey) 0%, #666 40%, #454545 72%, var(--charcoal) 100%)}
body.v-panel #main ul, body.v-panel #main .metric{background:rgba(63,95,134,.55);border-radius:8px;padding:30px 34px}
#page{position:absolute;inset:var(--margin);display:flex;flex-direction:column}
.top{display:flex;flex-direction:column;gap:8px}
.pillar{font:600 26px/32px Inter;letter-spacing:.16em;color:var(--studio-grey);text-transform:uppercase}
.source{font:400 22px/28px Inter;color:var(--studio-grey)}
.slide-no{position:absolute;right:0;top:0;font:600 22px/32px Inter;color:var(--studio-grey);letter-spacing:.1em}
.head{display:flex;gap:32px;margin-top:44px}
.bar{width:6px;background:var(--slate);flex:none;border-radius:1px}
h1{text-wrap:balance;font-family:Montserrat;font-weight:800;font-size:var(--head);line-height:var(--head-lh);letter-spacing:.005em;text-transform:uppercase}
h1 .hl{color:var(--light-blue);display:block}
h1 .ln{display:block}
#content{margin-top:48px;display:flex;flex-direction:column;flex:1;min-height:0}
#main{display:flex;flex-direction:column;gap:30px;flex:1;justify-content:center;padding-bottom:24px}
p.text{font-size:var(--body);line-height:var(--body-lh)}
p.text b, li b{font-weight:700}
ul{list-style:none;display:flex;flex-direction:column;gap:20px}
li{display:flex;gap:24px;font-size:var(--body);line-height:var(--body-lh)}
li .g{color:var(--light-blue);flex:none;width:34px;font-weight:700}
.lead{font:700 26px/32px Inter;letter-spacing:.14em;text-transform:uppercase;color:var(--studio-grey)}
.myth{border-left:6px solid var(--steel);padding:6px 0 6px 28px;display:flex;flex-direction:column;gap:6px}
.myth .tag{font:700 24px/30px Inter;letter-spacing:.16em;color:var(--studio-grey)}
.myth p{font-size:var(--body);line-height:var(--body-lh);font-style:italic;color:var(--studio-grey)}
.metric{display:flex;align-items:baseline;gap:28px}
.metric .v{font-family:Montserrat;font-weight:800;font-size:120px;line-height:1;color:var(--white)}
.metric .l{font-size:var(--body);line-height:var(--body-lh);color:var(--studio-grey);max-width:520px}
.closing{font-family:Montserrat;font-weight:700;font-size:34px;line-height:48px;flex:none}
/* Footer (approved Nov 2026): photo | name / websites (zubairakbar.com first) / "Follow me @zubairakbarpk" + 6 social icons */
footer{margin-top:24px;padding-top:26px;border-top:1px solid rgba(255,255,255,.22);display:flex;align-items:center;gap:24px;flex:none}
footer .ph{width:120px;height:120px;border-radius:50%;border:4px solid var(--white);flex:none;
  background:url(assets/headshot.jpg) 50% 32% / 140% auto no-repeat}
.who{display:flex;flex-direction:column;flex:1;min-width:0;white-space:nowrap}
.who .n{font:800 32px/40px Montserrat}
.who .w{font:400 22px/30px Inter;color:var(--studio-grey);margin-top:2px}
.who .w b{font-weight:600;color:var(--white)}
.who .w i{font-style:normal;opacity:.6;margin:0 6px}
.who .fl{display:flex;align-items:center;margin-top:8px;font:400 22px/28px Inter;color:var(--studio-grey)}
.who .fl b{font-weight:600;color:var(--white);margin-left:6px}
.icons{display:flex;gap:9px;margin-left:16px;color:var(--white)}
.icons .ic{width:32px;height:32px;border:2px solid currentColor;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.icons svg{width:15px;height:15px;fill:currentColor}
/* Edge: the slab stops above the footer so the footer runs the full width */
body.L-edge footer{margin-right:-198px}
.disc{display:none}

/* ---------- Asymmetric layouts (spec "layout"; default "classic") ---------- */
#deco{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#deco .slab,#deco .kick{position:absolute}
/* EDGE: dark vertical slab on the right with a rotated kicker word */
body.L-edge #deco .slab{top:0;right:0;width:230px;height:100%;background:linear-gradient(180deg,#151515 0%,var(--steel) 100%)}
body.L-edge #deco .kick{right:30px;bottom:88px;writing-mode:vertical-rl;transform:rotate(180deg);font:800 170px/1 Montserrat;color:rgba(255,255,255,.92);letter-spacing:.02em;white-space:nowrap}
body.L-edge #page{right:286px}
.discline{font:400 22px/28px Inter;color:var(--studio-grey);margin-top:14px;flex:none}
body.L-edge #canvas{background:radial-gradient(ellipse 760px 900px at 20% 18%, var(--mid-grey) 0%, #6A6A6A 36%, #464646 68%, var(--charcoal) 100%)}
/* GHOST: giant faint kicker bleeding off the bottom-right corner */
body.L-ghost #deco .kick{right:-36px;bottom:150px;font:800 520px/.78 Montserrat;color:rgba(255,255,255,.1);letter-spacing:-.03em;white-space:nowrap}
body.L-ghost #main{max-width:760px}
body.L-ghost #canvas{background:radial-gradient(ellipse 820px 700px at 8% 10%, var(--mid-grey) 0%, #6A6A6A 34%, #454545 66%, var(--charcoal) 100%)}
/* BLOCK: near-black top block with a diagonal cut, grey lower half */
body.L-block #deco .slab{left:0;top:0;width:100%;height:var(--blockh,640px);background:linear-gradient(160deg,#151515 0%,#151515 45%,var(--steel) 130%);clip-path:polygon(0 0,100% 0,100% calc(100% - 120px),0 100%)}
body.L-block #canvas{background:radial-gradient(ellipse 900px 700px at 85% 95%, var(--mid-grey) 0%, #6A6A6A 34%, #484848 66%, var(--charcoal) 100%)}
body.L-block #content{margin-top:150px}
body.L-block .bar{background:var(--slate)}
/* RIGHT: headline right-aligned with the bar on the right; list panel bleeds off the left edge */
body.L-right .top{align-items:flex-end;text-align:right}
body.L-right .slide-no{right:auto;left:0}
body.L-right .head{flex-direction:row-reverse}
body.L-right h1{text-align:right}
body.L-right #main ul,body.L-right #main .metric{background:rgba(63,95,134,.6);margin-left:-88px;padding:32px 40px 32px 88px;border-radius:0 8px 8px 0;margin-right:90px}
body.L-right #canvas{background:radial-gradient(ellipse 820px 700px at 92% 12%, var(--mid-grey) 0%, #6E6E6E 36%, #4A4A4A 68%, var(--charcoal) 100%)}

/* ---------- LIGHT theme (spec "theme": "light") ----------
   Brand light tokens: surface #FFFFFF, ink #151515, ink-muted #5C5C5C, studio-grey #D0D0D0.
   The ONE highlight line uses steel #3F5F86 (light-blue is unreadable on white). */
body.T-light{background:#FFFFFF}
body.T-light #canvas{color:#151515;background:radial-gradient(ellipse 980px 820px at var(--glow,50% 22%), #FFFFFF 0%, #F2F2F2 45%, #E2E2E2 75%, var(--studio-grey) 100%) !important}
body.T-light.L-ghost{--glow:10% 10%} body.T-light.L-edge{--glow:20% 18%} body.T-light.L-right{--glow:90% 12%} body.T-light.L-block{--glow:85% 95%}
body.T-light .pillar,body.T-light .source,body.T-light .lead,body.T-light .myth .tag,body.T-light .myth p,body.T-light .metric .l,
body.T-light .who .w,body.T-light .who .fl,body.T-light .disc,body.T-light .discline,body.T-light .slide-no{color:#5C5C5C}
body.T-light .metric .v{color:#151515}
body.T-light h1 .hl{color:var(--steel)}
body.T-light li .g{color:var(--slate)}
body.T-light.v-panel #main ul,body.T-light.v-panel #main .metric,body.T-light.L-right #main ul,body.T-light.L-right #main .metric{background:rgba(63,95,134,.11)}
body.T-light footer{border-top-color:rgba(21,21,21,.18)}
body.T-light footer .ph{box-shadow:0 0 0 1px var(--studio-grey),0 6px 18px rgba(21,21,21,.14)}
body.T-light .who .w b,body.T-light .who .fl b{color:#151515}
body.T-light .icons{color:#151515}
body.T-light.L-ghost #deco .kick{color:rgba(21,21,21,.06)}
/* Block keeps its dark top block in light theme: headline stays white with the light-blue line */
body.T-light.L-block .top .pillar,body.T-light.L-block .top .source{color:var(--studio-grey)}
body.T-light.L-block h1{color:#FFFFFF}
body.T-light.L-block h1 .hl{color:var(--light-blue)}
/* Optional series badge (spec "badge": path under designer/), top-right; top-left in the right layout */
#badge{position:absolute;top:0;right:0;height:60px;display:none}
body.L-right #badge{right:auto;left:0}
</style>
</head>

<script>
const S = window.SPEC;
// Faint network lines at 8% white, seeded so the same post always looks the same.
(function(){
  let seed = 0; for (const c of (S.id||'x')) seed = (seed*31 + c.charCodeAt(0)) >>> 0;
  const rnd = () => (seed = (seed*1664525 + 1013904223) >>> 0) / 4294967296;
  const svg = document.getElementById('net'), pts = [];
  const L = S.layout || 'classic';
  document.body.classList.add('L-'+L);
  const T = S.theme || 'dark'; document.body.classList.add('T-'+T);
  const ink = T==='light' ? '#151515' : '#fff';
  const V = L==='classic' ? (S.variant || ['top','left','panel'][seed % 3]) : (L==='ghost' ? 'panel-off' : 'top');
  document.body.classList.add('v-'+V); window.VARIANT = L+'/'+V;
  const box = L==='edge' ? [40,880,560,420] : L==='right' ? [0,-40,520,520] : L==='block' ? [520,-20,560,460] : V==='left' ? [560,640,560,420] : [560,-40,560,520];
  for (let i=0;i<26;i++){ const x = box[0] + rnd()*box[2], y = box[1] + rnd()*box[3]; pts.push([x,y]); }
  let s = '';
  pts.forEach((p,i)=>{ pts.forEach((q,j)=>{ if(j>i){ const d=Math.hypot(p[0]-q[0],p[1]-q[1]); if(d<190) s+=`<line x1="${p[0]}" y1="${p[1]}" x2="${q[0]}" y2="${q[1]}" stroke="${ink}" stroke-opacity=".08" stroke-width="1.5"/>`; }}); s+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${ink}" fill-opacity=".08"/>`; });
  svg.innerHTML = s;
})();
const esc = t => String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const rich = t => esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
document.getElementById('pillar').textContent = S.pillar || '';
if (S.badge){ const bg=document.getElementById('badge'); bg.src=S.badge; bg.style.display='block'; }
document.getElementById('source').textContent = S.source || '';
if (S.slide) document.getElementById('slideno').textContent = S.slide;
const h1 = document.getElementById('h1');
h1.innerHTML = (S.headline||[]).map(l=>`<span class="ln">${esc(l)}</span>`).join('') + (S.highlight?`<span class="hl">${esc(S.highlight)}</span>`:'');
document.getElementById('disc').textContent = S.disclaimer===false ? '' : ((S.disclaimer===true || !S.disclaimer) ? 'General information, not tax advice.' : S.disclaimer);
const glyph = S.format==='Checklist' ? '✓' : '▶';
const C = document.getElementById('content');
const M = document.createElement('div'); M.id='main'; C.appendChild(M);
for (const b of (S.blocks||[])){
  let el;
  if (b.type==='text'){ el=document.createElement('p'); el.className='text'; el.innerHTML=rich(b.text); }
  else if (b.type==='lead'){ el=document.createElement('div'); el.className='lead'; el.textContent=b.text; }
  else if (b.type==='list'){ el=document.createElement('ul'); el.innerHTML=b.items.map(i=>`<li><span class="g">${b.glyph||glyph}</span><span>${rich(i)}</span></li>`).join(''); }
  else if (b.type==='myth'){ el=document.createElement('div'); el.className='myth'; el.innerHTML=`<span class="tag">MYTH</span><p>“${esc(b.text)}”</p>`; }
  else if (b.type==='metric'){ el=document.createElement('div'); el.className='metric'; el.innerHTML=`<span class="v">${esc(b.value)}</span><span class="l">${rich(b.label)}</span>`; }
  else if (b.type==='closing'){ el=document.createElement('div'); el.className='closing'; el.textContent=b.text; }
  if (el) (b.type==='closing' ? C : M).appendChild(el);
}
// Fit: step down headline then body until nothing overflows. Never below 26px body (brand minimum 22px).
const root = document.documentElement.style;
const steps = [[72,81,34,48],[62,70,34,48],[62,70,31,44],[56,64,30,42],[56,64,28,39],[52,60,26,36]];
window.FIT = 'fail';
function overflowing(){
  const hl = h1.querySelector('.hl'); const lh = parseFloat(getComputedStyle(h1).lineHeight);
  const hlWraps = hl && hl.getBoundingClientRect().height > lh * 1.5;
  const lines = [...h1.querySelectorAll('.ln')].some(l => l.getBoundingClientRect().height > lh * 1.5);
  return C.scrollHeight > C.clientHeight + 1 || M.scrollHeight > M.clientHeight + 1 || h1.scrollWidth > h1.clientWidth + 1 || hlWraps || lines;
}
document.getElementById('kick').textContent = S.kicker || '';
// Disclaimer sits on its own line above the footer in every layout (the footer is full width).
if (document.getElementById('disc').textContent){ const d=document.createElement('div'); d.className='discline'; d.textContent=document.getElementById('disc').textContent; C.appendChild(d); }
function sizeDeco(){
  const L = S.layout || 'classic';
  if (L==='block'){ // block ends below the headline, plus room for the diagonal
    const hb = document.querySelector('.head').getBoundingClientRect().bottom;
    root.setProperty('--blockh', Math.round(hb + 150) + 'px');
  }
  if (L==='edge'){ // shrink the rotated kicker until it fits the slab height
    const ft = Math.round(document.querySelector('footer').getBoundingClientRect().top);
    document.querySelector('#deco .slab').style.height = (ft - 24) + 'px';
    const k = document.getElementById('kick'); k.style.bottom = (1350 - ft + 24 + 40) + 'px'; let fs = 170;
    while (fs > 90 && k.getBoundingClientRect().height > ft - 24 - 120){ fs -= 6; k.style.fontSize = fs+'px'; }
  }
}
document.fonts.ready.then(()=>{
  for (const [h,hl,b,bl] of steps){
    root.setProperty('--head',h+'px'); root.setProperty('--head-lh',hl+'px');
    root.setProperty('--body',b+'px'); root.setProperty('--body-lh',bl+'px');
    if (!overflowing()){ window.FIT = `headline ${h}px, body ${b}px`; break; }
  }
  sizeDeco();
  window.READY = true;
});
</script>
</body>
